[package]
name = "symplex"
version = "0.11.1"
edition = "2024"
rust-version = "1.93.0"
license = "MIT OR Apache-2.0"
description = "Exact symbolic mathematics for Rust: calculus, summation, solving, linear algebra, transforms, compile-time dimensional analysis, and Rust/C code generation"
repository = "https://github.com/cgorski/symplex"
homepage = "https://github.com/cgorski/symplex"
documentation = "https://docs.rs/symplex"
readme = "README.md"
keywords = ["symbolic", "math", "cas", "codegen", "robotics"]
categories = ["mathematics", "science", "development-tools::build-utils"]
# Keep the published tarball to what `cargo test` / `cargo doc` need.
exclude = [
    "/book",
    "/probes",
    "/scripts",
    "/.github",
    "/fuzz",
    "/symplex-wasm",
    "/*.log",
]

[dependencies]
symplex-macros = { version = "0.3.2", path = "symplex-macros" }
num-bigint = "0.4"
num-rational = "0.4"
num-integer = "0.1"
num-traits = "0.2"
smallvec = "1.13"
rustc-hash = "2.1"
bitflags = "2.11"
parking_lot = "0.12"
thiserror = "2.0"
astro-float = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
typenum = "1.19"

[dev-dependencies]
criterion = "0.5"
proptest = "1.10"
trybuild = "1"
static_assertions = "1.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-test = "0.2"

[[bench]]
name = "canonicalization"
harness = false

[[bench]]
name = "exact_matrix"
harness = false
