[package]
name = "symplex"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.0"
license = "MIT OR Apache-2.0"
description = "A fast, correct symbolic mathematics library for Rust"
repository = "https://github.com/cgorski/symplex"
homepage = "https://github.com/cgorski/symplex"
documentation = "https://docs.rs/symplex"
readme = "README.md"
keywords = ["symbolic", "math", "algebra", "cas", "calculus"]
categories = ["mathematics", "science"]

[dependencies]
symplex-macros = { version = "0.1.0", path = "symplex-macros" }
num-bigint = "0.4"
num-rational = "0.4"
num-integer = "0.1"
num-traits = "0.2"
smallvec = "1.13"
rustc-hash = "2.1"
bitflags = "2.11"
parking_lot = "0.12"
thiserror = "2.0"
astro-float = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
criterion = "0.5"
proptest = "1.10"
trybuild = "1"
static_assertions = "1.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-test = "0.2"

[[bench]]
name = "canonicalization"
harness = false
