[package]
name = "symplex-format"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.0"
license = "MIT OR Apache-2.0"
description = "LaTeX and MathML rendering for symplex symbolic expressions"
repository = "https://github.com/cgorski/symplex"
keywords = ["latex", "mathml", "symbolic", "math", "rendering"]
categories = ["mathematics", "text-processing"]

[dependencies]
symplex = { version = "0.1.0", path = ".." }
