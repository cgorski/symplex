[package]
name = "symplex-wasm"
version = "0.8.2"
edition = "2024"
rust-version = "1.93.0"
license = "MIT OR Apache-2.0"
description = "WebAssembly bindings for symplex symbolic mathematics"
repository = "https://github.com/cgorski/symplex"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
symplex = { version = "0.8.2", path = ".." }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Forwards Rust panics to `console.error` in the browser.  Optional so
# size-sensitive builds can drop it with `--no-default-features`.
console_error_panic_hook = { version = "0.1", optional = true }

# `astro-float` -> `rand` -> `getrandom`; on wasm32-unknown-unknown the
# latter needs the `js` feature to source entropy from the browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
