[package]
name = "clippy_canary"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Calls every astro-float method the root clippy.toml disallows; CI expects clippy to reject each call"

[dependencies]
# The main crate's requirement, so CI resolves the same release.
astro-float = "0.9.6"

# Its own workspace (like `probes/golden`): not a member of the symplex package.
[workspace]
