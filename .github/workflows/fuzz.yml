name: Fuzz

# Nightly coverage-guided fuzzing (cargo-fuzz / libFuzzer).  One job per
# target, so a failure names its target and carries only its own artifact.
# The targets check exact identities (exact_matrix, poly), probability
# invariants (numdist), value preservation (simplify) and F′ = f
# (integrate), evalf self-consistency (evalf), the calculus routines
# against numerical oracles (calculus) and the display/parse round trip
# (roundtrip) — see fuzz/README.md.  A failing job uploads the crashing
# input; reproduce it with the commands printed in the job summary.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Fuzzing time per target, in seconds"
        default: "600"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_numdist
          - fuzz_exact_matrix
          - fuzz_poly
          - fuzz_simplify
          - fuzz_integrate
          - fuzz_parser
          - fuzz_refine
          - fuzz_eigenvects
          - fuzz_lambertw
          - fuzz_evalf
          - fuzz_calculus
          - fuzz_roundtrip
    env:
      SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || '600' }}
      # cargo-fuzz defaults `--target` to the triple it was built for, and
      # the prebuilt binary is a musl build (no sanitizer, no musl std here).
      FUZZ_TARGET_TRIPLE: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # The corpus grows across nights: restore the newest one for this
      # target, save the grown one under a fresh key.
      - uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Build
        run: cargo fuzz build --target "$FUZZ_TARGET_TRIPLE" ${{ matrix.target }}
      - name: Fuzz for ${{ env.SECONDS_PER_TARGET }} s
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cargo fuzz run --target "$FUZZ_TARGET_TRIPLE" ${{ matrix.target }} -- \
            -max_total_time=${SECONDS_PER_TARGET} -timeout=30 -rss_limit_mb=4096 \
            -print_final_stats=1
      - name: Decode the failing input
        if: failure()
        run: |
          shopt -s nullglob
          inputs=(fuzz/artifacts/${{ matrix.target }}/*)
          if [ ${#inputs[@]} -eq 0 ]; then
            echo "no failing input was written (the failure is not a finding)"
            exit 0
          fi
          cargo fuzz build --target "$FUZZ_TARGET_TRIPLE" print_expr
          for f in "${inputs[@]}"; do
            echo "::group::$f"
            base64 -w0 "$f"; echo
            cargo fuzz run --target "$FUZZ_TARGET_TRIPLE" print_expr "$f" 2>/dev/null | grep '^depth' || true
            # The differential targets print their decoded case and message.
            FUZZ_SHOW=1 cargo fuzz run --target "$FUZZ_TARGET_TRIPLE" ${{ matrix.target }} "$f" 2>&1 \
              | grep -E '^fuzz_|panicked|^  ' | head -40 || true
            echo "::endgroup::"
          done
          {
            echo "### ${{ matrix.target }} failed"
            echo
            echo "Download the \`fuzz-${{ matrix.target }}\` artifact, then:"
            echo
            echo '```sh'
            echo "cargo +nightly fuzz build -s none ${{ matrix.target }}"
            echo "fuzz/target/*/release/${{ matrix.target }} <artifact>      # replay (~1 s)"
            echo "fuzz/target/*/release/print_expr <artifact>                # the decoded expression"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30
