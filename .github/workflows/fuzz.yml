name: Fuzz

# Nightly coverage-guided fuzzing (cargo-fuzz / libFuzzer).  One job per
# target, so a failure names its target and carries only its own artifact.
# The targets check exact identities (exact_matrix, poly), probability
# invariants (numdist) and the properties of the symbolic distributions
# (stats), value preservation (simplify) and F′ = f
# (integrate), evalf self-consistency (evalf), the calculus routines
# against numerical oracles (calculus) and the display/parse round trip
# (roundtrip) — see fuzz/README.md.  A failing job uploads the crashing
# input; reproduce it with the commands printed in the job summary.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Fuzzing time per target, in seconds"
        default: "600"

permissions:
  contents: read

# A newer run replaces an older one of the same kind only: a manual run
# used to cancel the nightly one (and the nightly a manual one).
concurrency:
  group: fuzz-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    # Build, ten minutes of fuzzing, and at most twelve of decoding.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_numdist
          - fuzz_stats
          - fuzz_exact_matrix
          - fuzz_poly
          - fuzz_simplify
          - fuzz_integrate
          - fuzz_parser
          - fuzz_refine
          - fuzz_eigenvects
          - fuzz_lambertw
          - fuzz_evalf
          - fuzz_calculus
          - fuzz_roundtrip
    env:
      SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || '600' }}
      # cargo-fuzz defaults `--target` to the triple it was built for, and
      # the prebuilt binary is a musl build (no sanitizer, no musl std here).
      FUZZ_TARGET_TRIPLE: x86_64-unknown-linux-gnu
      # These builds keep AddressSanitizer (cargo-fuzz's default; the local
      # release campaigns use `-s none`, so the two complement each other).
      # ASan stores the stack of every distinct allocation and free site in
      # a depot it never frees, 30 frames each by default, and a computer
      # algebra system has a vast number of distinct call paths: the RSS
      # grew with every input (fuzz_integrate 4,098 MB at ~4,400 inputs of
      # its corpus, out of memory, on 0.47 development code; fuzz_calculus
      # 3,994 MB) while the same replay without ASan stays at 63 MB.  Five
      # frames and a 64 MB quarantine: the same replay peaks at 396 MB.
      ASAN_OPTIONS: malloc_context_size=5:quarantine_size_mb=64
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # The corpus grows across nights: restore the newest one for this
      # target, save the grown one under a fresh key.
      - uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Build
        run: cargo fuzz build --target "$FUZZ_TARGET_TRIPLE" ${{ matrix.target }}
      - name: Fuzz for ${{ env.SECONDS_PER_TARGET }} s
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cargo fuzz run --target "$FUZZ_TARGET_TRIPLE" ${{ matrix.target }} -- \
            -max_total_time=${SECONDS_PER_TARGET} -timeout=30 -rss_limit_mb=4096 \
            -print_final_stats=1
      # The input is saved before anything replays it: a replay of an input
      # that hangs has no limit of its own, and up to 0.57 the decoding step
      # ran first, was cancelled with the job after 30 minutes, and the
      # input was never uploaded (runs 38871441556 and 38928437298).
      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30
      - name: Decode the failing input
        if: failure()
        timeout-minutes: 12
        run: |
          shopt -s nullglob
          inputs=(fuzz/artifacts/${{ matrix.target }}/*)
          if [ ${#inputs[@]} -eq 0 ]; then
            echo "no failing input was written (the failure is not a finding)"
            exit 0
          fi
          {
            echo "### ${{ matrix.target }} failed"
            echo
            echo "Download the \`fuzz-${{ matrix.target }}\` artifact (or decode the base64 line of the log), then:"
            echo
            echo '```sh'
            echo "cargo +nightly fuzz build -s none ${{ matrix.target }}"
            echo "fuzz/target/*/release/${{ matrix.target }} <artifact>      # replay (~1 s)"
            echo "fuzz/target/*/release/print_expr <artifact>                # the decoded expression"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Every input as base64 first: the log then holds it whatever the
          # replays below do.
          for f in "${inputs[@]}"; do
            echo "$f: $(base64 -w0 "$f")"
          done
          timeout --signal=KILL 300 cargo fuzz build --target "$FUZZ_TARGET_TRIPLE" print_expr || true
          for f in "${inputs[@]}"; do
            echo "::group::$f"
            timeout --signal=KILL 60 cargo fuzz run --target "$FUZZ_TARGET_TRIPLE" print_expr "$f" 2>/dev/null | grep '^depth' || true
            # The differential targets print their decoded case and message.
            # A replay is bounded twice: libFuzzer reports where an input
            # that is still running after 60 s is, and `timeout` ends one
            # that does not return from there.
            FUZZ_SHOW=1 timeout --signal=KILL 120 cargo fuzz run --target "$FUZZ_TARGET_TRIPLE" ${{ matrix.target }} "$f" \
              -- -timeout=60 -rss_limit_mb=4096 2>&1 \
              | grep -E '^fuzz_|panicked|^  |libFuzzer: (timeout|out-of-memory|deadly)|^ +#[0-9]+ ' | head -60 || true
            echo "::endgroup::"
          done
