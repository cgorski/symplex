[package]
name = "symplex-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.symplex]
path = ".."

[[bin]]
name = "fuzz_parser"
path = "fuzz_targets/fuzz_parser.rs"
doc = false

[[bin]]
name = "fuzz_refine"
path = "fuzz_targets/fuzz_refine.rs"
doc = false

[[bin]]
name = "fuzz_eigenvects"
path = "fuzz_targets/fuzz_eigenvects.rs"
doc = false

[[bin]]
name = "fuzz_lambertw"
path = "fuzz_targets/fuzz_lambertw.rs"
doc = false
